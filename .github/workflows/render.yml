name: Tegn TRMNL-skjermer

on:
  schedule:
    - cron: '7,37 * * * *'   # hver halvtime (UTC). GitHub kan forsinke kjøringer noen minutter.
  workflow_dispatch:          # «Run workflow»-knapp for manuell kjøring
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Hent fonter (SIL Open Font License)
        run: |
          mkdir -p fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -sSLf -o fonts/SpaceGrotesk.ttf      "$base/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf"
          curl -sSLf -o fonts/IBMPlexMono-Bold.ttf    "$base/ibmplexmono/IBMPlexMono-Bold.ttf"
          curl -sSLf -o fonts/IBMPlexMono-Regular.ttf "$base/ibmplexmono/IBMPlexMono-Regular.ttf"

      - name: Tegn skjermene
        env:
          HOME_LAT: '59.66'   # din posisjon, brukes for «nærmest deg»
          HOME_LON: '10.79'
          TZ_NAME: 'Europe/Oslo'
        run: python render.py --dump

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
